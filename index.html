<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyEarn Ghana - FIXED 299</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:15px}
.card{background:#fff;padding:20px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}
.btn-p{background:#00c853;color:#fff}
.btn-d{background:#111;color:#fff}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.small{font-size:12px;color:#666}
.live{background:#e3f2fd;border:2px solid #2196f3;padding:8px;border-radius:10px;text-align:center;font-weight:bold;color:#0d47a1;margin:8px 0}
</style>
</head>
<body>
<div id="authBox" class="card">
<h2>BuyEarn 299 - LOGIN FIXED</h2>
<input id="email" type="email" placeholder="Email e.g. Issakaosman94@gmail.com">
<input id="password" type="password" placeholder="Password 6+ chars">
<button class="btn btn-p" onclick="login()">LOGIN - Sync Phone & Laptop</button>
<button class="btn btn-d" onclick="register()">REGISTER NEW ACCOUNT</button>
<div class="live">Auth is now ENABLED in Firebase!</div>
<p class="small" id="msg"></p>
</div>
<div id="mainBox" class="card" style="display:none">
<h2>Welcome <span id="userEmail"></span></h2>
<p>Wallet: GHS <span id="wallet">0</span> - LIVE SYNCED!</p>
<button class="btn btn-d" onclick="logout()">Logout</button>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAqLK43cuGSOyujMMAxLDa-KjWQ7hS7Oa8",
  authDomain: "buyearn-4f226.firebaseapp.com",
  projectId: "buyearn-4f226",
  storageBucket: "buyearn-4f226.firebasestorage.app",
  messagingSenderId: "580921744825",
  appId: "1:580921744825:web:faaa41515119c7c3e2ea68",
  measurementId: "G-3C4KZGWC7T"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
function $(id){return document.getElementById(id);}
function login(){
  const email=$("email").value.trim();
  const password=$("password").value.trim();
  const msg=$("msg");
  if(!email){alert("Type Email!");return;}
  if(!email.includes("@")){alert("Email must have @");return;}
  if(password.length<6){alert("Password 6+ chars");return;}
  msg.innerText="Logging in...";
  auth.signInWithEmailAndPassword(email,password).then(()=>{msg.innerText="SUCCESS";alert("LOGIN SUCCESS - Synced!");}).catch(e=>{msg.innerText=e.message;alert(e.code+" - "+e.message);});
}
function register(){
  const email=$("email").value.trim();
  const password=$("password").value.trim();
  if(!email){alert("Type Email");return;}
  if(password.length<6){alert("Password 6+");return;}
  $("msg").innerText="Registering...";
  auth.createUserWithEmailAndPassword(email,password).then(c=>{
    alert("REGISTER SUCCESS! Now click LOGIN!");
    db.ref("users/"+c.user.uid).set({email:email,wallet:0,joined:Date.now()});
  }).catch(e=>alert(e.code+" - "+e.message));
}
function logout(){auth.signOut().then(()=>location.reload());}
auth.onAuthStateChanged(u=>{
  if(u){
    $("authBox").style.display="none";
    $("mainBox").style.display="block";
    $("userEmail").innerText=u.email;
    db.ref("users/"+u.uid).on("value",s=>{const d=s.val();if(d)$("wallet").innerText=d.wallet||0;});
  }else{
    $("authBox").style.display="block";
    $("mainBox").style.display="none";
  }
});
</script>
</body>
</html>

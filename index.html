<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>BUYEARN GHANA</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f7fb} .header{background:#0a1931;color:white;padding:20px;text-align:center}
.header h1{color:#ffc107} .btn{background:#ffc107;color:#0a1931;padding:14px;border:none;border-radius:8px;font-weight:bold;width:100%;margin:10px 0;cursor:pointer}
.card{background:white;margin:15px;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.balance{font-size:32px;font-weight:bold;text-align:center} .small{color:#666;font-size:14px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
.task{display:flex;gap:12px;align-items:center;border:1px solid #eee;padding:10px;border-radius:10px;margin:8px 0}
</style></head><body>
<div class="header"><h1>BUYEARN GHANA 🇬🇭</h1><p>Pay 299 Once - Earn Daily</p></div>

<div class="card" id="payCard">
<h2>Activate Account</h2>
<p class="small">Pay 299 GHS once to start earning</p>
<button class="btn" onclick="pay()">Pay 299 GHS - Activate Now</button>
<p id="payMsg"></p>
</div>

<div class="card">
<div class="balance" id="bal">0.00 GHS</div>
<p style="text-align:center" class="small">Wallet Balance</p>
</div>

<div class="card">
<h2>Daily Tasks</h2>
<p class="small">Complete 5 tasks to earn 1 GHS daily</p>
<div id="tasks"></div>
<p class="small" id="tInfo"></p>
</div>

<div class="card">
<h2>Cashout</h2>
<p class="small">Available Friday only - Minimum 20 GHS</p>
<input type="number" id="cashAmt" placeholder="Enter amount e.g 20">
<p class="small">You will receive: <b><span id="receive">0.00</span> GHS</b></p>
<button class="btn" onclick="cashout()">Request Cashout</button>
<p id="cashMsg"></p>
</div>

<div class="card">
<h2>My Referrals</h2>
<p class="small">Earn 50 GHS per friend</p>
<input id="refLink" readonly>
<button class="btn" style="background:#0a1931;color:white" onclick="copyR()">Copy Link</button>
<p class="small" id="refStat"></p>
</div>

<script>
const KEY="pk_live_0f37f02ac63223a809256075ba4fcb3315400869";
let wallet=parseFloat(localStorage.getItem('w')||0);
let active=localStorage.getItem('active')=='1';
let liked=JSON.parse(localStorage.getItem('liked')||'[]');
let code=localStorage.getItem('rc')||'BUY'+Math.floor(Math.random()*900000+100000);
localStorage.setItem('rc',code);
let tasksData=JSON.parse(localStorage.getItem('td')||'[]');
if(!tasksData.length){tasksData=[{id:1,img:'https://picsum.photos/200?1'},{id:2,img:'https://picsum.photos/200?2'},{id:3,img:'https://picsum.photos/200?3'},{id:4,img:'https://picsum.photos/200?4'},{id:5,img:'https://picsum.photos/200?5'}]}

function render(){
document.getElementById('bal').innerText=wallet.toFixed(2)+' GHS';
document.getElementById('refLink').value=location.href.split('?')[0]+'?ref='+code;
document.getElementById('refStat').innerText='Referrals: 0';
document.getElementById('payCard').style.display=active?'none':'block';
let d=document.getElementById('tasks'); d.innerHTML='';
tasksData.forEach(t=>{
let done=liked.includes(t.id);
d.innerHTML+=`<div class=task><img src="${t.img}" style="width:60px;height:60px;border-radius:8px"><div style="flex:1"><b>Task ${t.id}</b></div><button class=btn style="width:auto;padding:8px 14px" ${done?'disabled':''} onclick="like(${t.id})">${done?'Done ✓':'Like'}</button></div>`;
});
document.getElementById('tInfo').innerText=`Done: ${liked.length}/5`;
}
function like(id){
if(!active){alert('Pay 299 GHS first');return;}
if(liked.includes(id))return;
liked.push(id); localStorage.setItem('liked',JSON.stringify(liked));
if(liked.length==5){wallet+=1; localStorage.setItem('w',wallet); alert('Earned 1 GHS!'); liked=[]; localStorage.setItem('liked',JSON.stringify(liked));}
render();
}
function pay(){
PaystackPop.setup({key:KEY,email:'user@buyearn.com',amount:29900,currency:'GHS',callback:function(){localStorage.setItem('active','1');active=true;render();document.getElementById('payMsg').innerText='Activated!';}}).openIframe();
}
function cashout(){
let a=parseFloat(document.getElementById('cashAmt').value);
if(!a||a<20){alert('Min 20');return;}
if(a>wallet){alert('Low balance');return;}
let net=a*0.9; wallet-=a; localStorage.setItem('w',wallet); render();
document.getElementById('cashMsg').innerText=`Request sent: You will receive ${net.toFixed(2)} GHS on Friday`;
}
document.getElementById('cashAmt').addEventListener('input',e=>{document.getElementById('receive').innerText=((parseFloat(e.target.value)||0)*0.9).toFixed(2))});
function copyR(){navigator.clipboard.writeText(document.getElementById('refLink').value); alert('Copied');}
render();
</script></body></html>

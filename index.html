<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyEarn Ghana - Shop & Earn</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
*{padding:0;margin:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f5f5}
.header{background:#00c853;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
.hero{background:linear-gradient(135deg,#00c853,#009624);color:#fff;padding:28px 16px;text-align:center}
.pay-btn{background:#000;color:#fff;border:none;padding:16px 28px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;width:90%;max-width:400px;margin:16px auto;display:block}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.prod-img{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#eee}
.like-btn{width:100%;padding:10px;border:none;border-radius:8px;margin-top:8px;font-weight:700;cursor:pointer;background:#eee}
.like-btn.liked{background:#00c853;color:#fff}
.admin-overlay{display:none;position:fixed;inset:0;background:#0008;z-index:100;padding:20px;overflow:auto}
.admin-inner{background:#fff;max-width:450px;margin:auto;padding:20px;border-radius:16px}
.admin-inner input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
.upload-box{border:2px dashed #00c853;padding:20px;text-align:center;border-radius:12px;margin:8px 0;background:#f9fff9;cursor:pointer}
.preview-img{width:100%;height:200px;object-fit:cover;border-radius:10px;display:none;margin-top:10px}
</style>
</head>
<body>
<div class="header"><h2>BuyEarn Ghana 🇬🇭</h2><p style="font-size:13px">Shop & Earn Daily</p></div>
<div class="hero"><h1>Earn Daily by Liking Products</h1><p style="margin-top:8px">Like 5 products = GHS 5 • Pay GHS 299 once to start</p><button class="pay-btn" onclick="payWithPaystack()">💳 Pay GHS 299 to Activate - Paystack</button><p id="payStatus" style="margin-top:10px;font-weight:700"></p></div>
<div style="padding:12px"><h3 style="padding:8px;">🔥 Like 5 Products Today</h3><div class="grid" id="productGrid"></div><p style="text-align:center;margin-top:10px">Liked today: <span id="likedCount">0</span>/5 - Earned: GHS <span id="earned">0</span></p></div>
<button onclick="openAdmin()" style="background:#000;color:#fff;padding:10px 20px;border:none;border-radius:20px;position:fixed;bottom:20px;right:20px;z-index:50">⚙️ Admin</button>
<div id="adminModal" class="admin-overlay"><div class="admin-inner"><h2 style="text-align:center;">⚙️ Admin Upload</h2><p style="text-align:center;font-size:12px;color:#666;margin-bottom:10px">Upload from your phone gallery</p><input id="adminPass" type="password" placeholder="Admin Password"><input id="pName" placeholder="Product Name"><input id="pPrice" placeholder="Price (e.g. GHS 899)" value="GHS "><div class="upload-box" onclick="document.getElementById('pFile').click()"><span style="font-size:30px">📸</span><br><b>Click to Upload from Gallery</b><br><span style="font-size:12px;color:#666">Choose photo from phone</span><input type="file" id="pFile" accept="image/*" style="display:none" onchange="previewFile()"></div><img id="preview" class="preview-img"><input id="pImage" placeholder="OR paste Image Link (optional)"><button onclick="saveProduct()" style="width:100%;background:#00c853;color:white;padding:14px;border:none;border-radius:10px;font-weight:700;font-size:16px;margin-top:10px;cursor:pointer">💾 Save Product</button><button onclick="closeAdmin()" style="width:100%;background:#eee;padding:10px;border:none;border-radius:10px;margin-top:8px;cursor:pointer">Close</button><div id="adminList" style="margin-top:12px;font-size:12px;max-height:200px;overflow:auto"></div></div></div>
<script>
const PAYSTACK_KEY = "pk_live_pk_live_0f37f02ac63223a809256075ba4fcb3315400869";
const PAY_AMOUNT = 29900;
const ADMIN_PASS = "buyearn2024";
let defaultProducts = [{name:"Nike Air Max 270",price:"GHS 899",image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},{name:"Adidas Sneakers",price:"GHS 750",image:"https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500"},{name:"Puma Runner",price:"GHS 650",image:"https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=500"},{name:"iPhone 14 Pro",price:"GHS 12000",image:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500"},{name:"Samsung Galaxy",price:"GHS 8500",image:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500"},{name:"Laptop HP",price:"GHS 5500",image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500"}];
let products = JSON.parse(localStorage.getItem('buyearn_products') || 'null') || defaultProducts;
let likedToday = JSON.parse(localStorage.getItem('buyearn_liked') || '[]');
let imageBase64 = "";
function previewFile(){const file=document.getElementById('pFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){imageBase64=e.target.result;document.getElementById('preview').src=imageBase64;document.getElementById('preview').style.display='block';};reader.readAsDataURL(file);}
function renderProducts(){const grid=document.getElementById('productGrid');grid.innerHTML="";products.forEach((p,i)=>{const isLiked=likedToday.includes(i);grid.innerHTML+=`<div class="card"><img src="${p.image}" class="prod-img"><h4 style="margin-top:8px;font-size:14px">${p.name}</h4><p style="color:#00c853;font-weight:700">${p.price}</p><button class="like-btn ${isLiked?'liked':''}" onclick="likeProduct(${i})">${isLiked?'❤️ Liked':'🤍 Like'}</button></div>`;});document.getElementById('likedCount').innerText=likedToday.length;document.getElementById('earned').innerText=likedToday.length*1;renderAdminList();}
function likeProduct(i){if(likedToday.includes(i))return alert("Already liked today!");if(likedToday.length>=5)return alert("You liked 5 today! Come tomorrow");likedToday.push(i);localStorage.setItem('buyearn_liked',JSON.stringify(likedToday));renderProducts();}
function openAdmin(){document.getElementById('adminModal').style.display='block';}
function closeAdmin(){document.getElementById('adminModal').style.display='none';}
function saveProduct(){const pass=document.getElementById('adminPass').value;if(pass!==ADMIN_PASS)return alert("Wrong password!");const name=document.getElementById('pName').value.trim();const price=document.getElementById('pPrice').value.trim();const link=document.getElementById('pImage').value.trim();let finalImage="";if(imageBase64)finalImage=imageBase64;else if(link)finalImage=link;else return alert("Please upload photo from gallery or paste link!");if(!name)return alert("Enter product name!");products.unshift({name,price,image:finalImage});localStorage.setItem('buyearn_products',JSON.stringify(products));document.getElementById('pName').value="";document.getElementById('pPrice').value="GHS ";document.getElementById('pImage').value="";document.getElementById('pFile').value="";imageBase64="";document.getElementById('preview').style.display='none';renderProducts();alert("✅ Product Added!");}
function renderAdminList(){const list=document.getElementById('adminList');list.innerHTML="<b>Current Products ("+products.length+"):</b><br>";products.forEach((p,i)=>{list.innerHTML+=`<div style="display:flex;gap:8px;margin-top:8px;align-items:center"><img src="${p.image}" style="width:40px;height:40px;object-fit:cover;border-radius:6px"><span>${p.name}</span><button onclick="deleteProduct(${i})" style="margin-left:auto;color:red;border:none;background:#fee;padding:4px 8px;border-radius:6px">Delete</button></div>`;});}
function deleteProduct(i){if(!confirm("Delete this product?"))return;products.splice(i,1);localStorage.setItem('buyearn_products',JSON.stringify(products));renderProducts();}
function payWithPaystack(){let handler=PaystackPop.setup({key:PAYSTACK_KEY,email:"customer@buyearn.com",amount:PAY_AMOUNT*100,currency:"GHS",callback:function(response){document.getElementById('payStatus').innerText="✅ Payment Successful! ID: "+response.reference;alert("Payment success! You can now earn daily!");localStorage.setItem('buyearn_paid','true');},onClose:function(){document.getElementById('payStatus').innerText="Payment window closed";}});handler.openIframe();}
renderProducts();
</script>
</body>
</html>

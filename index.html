<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyEarn LIVE - 299 GHS FINAL 10% FEE - 20=18 50=45</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
:root{--green:#0a7a42;--gold:#ffcc00;--dark:#0f172a;--gray:#f1f5f9}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}
body{background:var(--gray);color:var(--dark)}
header{background:var(--dark);color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.logo{font-weight:900;font-size:22px}.logo span{color:var(--gold)}
.badge{background:var(--green);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.container{max-width:1100px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:10px;color:var(--dark);border-left:4px solid var(--green);padding-left:8px}
.btn{border:none;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer;width:100%;transition:.2s}
.btn-green{background:var(--green);color:white}.btn-gold{background:var(--gold);color:black}.btn-dark{background:var(--dark);color:white}.btn:disabled{opacity:.4;cursor:not-allowed}
.stat{font-size:28px;font-weight:900;color:var(--green)}.small{font-size:12px;color:#64748b}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.product{border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:white}
.product img{width:100%;height:130px;object-fit:cover}
.product div{padding:8px}
.friday-only{background:#fef3c7;border:2px dashed #f59e0b;padding:10px;border-radius:10px;text-align:center;font-weight:800;margin:10px 0}
.fee-table{width:100%;border-collapse:collapse;font-size:13px}
.fee-table th,.fee-table td{border:1px solid #e2e8f0;padding:8px;text-align:left}
.fee-table th{background:var(--dark);color:white}
.admin-panel{background:#fffbeb;border:2px solid var(--gold)}
input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0}
.role-switch{display:flex;gap:8px;margin-bottom:12px}
.role-switch button{flex:1;padding:8px;border-radius:8px;border:1px solid #cbd5e1;background:white;font-weight:700;cursor:pointer}
.role-switch .active{background:var(--dark);color:white}
</style>
</head>
<body>
<header>
<div class="logo">BUY<span>EARN</span> LIVE</div>
<div style="display:flex;gap:8px;align-items:center">
<div class="badge" id="roleBadge">USER</div>
<div class="badge" style="background:var(--gold);color:black" id="dayBadge"></div>
</div>
</header>
<div class="container">
<div class="role-switch">
<button id="userBtn" class="active" onclick="setRole('USER')">USER VIEW</button>
<button id="adminBtn" onclick="setRole('ADMIN')">ADMIN (You)</button>
</div>

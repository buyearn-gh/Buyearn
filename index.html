 <!DOCTYPE html>
<html>
<head>
<title>BuyEarn LIVE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>
<h2>BUYEARN LIVE - 299 GHS</h2>
<p>Role: <span id="role">GUEST</span></p>
<p id="balance">Balance: 0.00 GHS</p>
<p id="likes">Likes Today: 0/5 | 1 LIKE = 0.20 GHS</p>
<p>FRIDAY ONLY | 20 Gross = 18 Net</p>
<div id="tasks"></div>
<button onclick="pay299()">Pay 299 GHS LIVE</button>
<button onclick="requestCashout()">Cashout Friday</button>
<button onclick="showReferrals()">Referrals</button>
<script>
const PK_LIVE = 'pk_live_0f37f02ac63223a809256075ba4fcb3315400869';
let user = {balance:0, likesToday:0, role:'GUEST'};
function pay299(){
 let email = prompt('Email:');
 PaystackPop.setup({
  key: PK_LIVE, email: email, amount: 29900, currency: 'GHS',
  callback: function(res){
   user.role='USER';
   document.getElementById('role').innerText='USER';
   alert('Success Ref: ' + res.reference);
  }
 }).openIframe();
}
function loadTasks(){
 let tasks=['Shoe','Bag','Phone','Dress','Watch','Car'];
 let div=document.getElementById('tasks');
 for(let i=0;i<tasks.length;i++){
  div.innerHTML+='<div>'+tasks[i]+' Pic <button onclick="likeTask('+i+')" id="btn'+i+'">LIKE 0.20</button></div>';
 }
}
function likeTask(id){
 if(user.role!=='USER'){ alert('Pay 299 first!'); return; }
 if(user.likesToday>=5){ alert('Max 5 today!'); return; }
 user.likesToday++; user.balance+=0.20;
 document.getElementById('balance').innerText='Balance: ' + user.balance.toFixed(2) + ' GHS';
 document.getElementById('likes').innerText='Likes Today: ' + user.likesToday + '/5';
 document.getElementById('btn'+id).disabled=true;
}
function requestCashout(){
 let day = new Date().getDay();
 if(day!==5){ alert('FRIDAY ONLY! Today not Friday'); return; }
 if(user.balance<20){ alert('Need 20 GHS Min. You have ' + user.balance.toFixed(2) + ' GHS'); return; }
 let gross = parseFloat(prompt('You have ' + user.balance.toFixed(2) + ' GHS. Amount? Min 20'));
 if(!gross || gross<20 || gross>user.balance){ alert('Invalid'); return; }
 let net = gross*0.9; let fee = gross*0.1;
 if(confirm('CONFIRM:\nGross: ' + gross + ' GHS\nFee 10%: ' + fee + ' GHS\nNet to MoMo: ' + net + ' GHS')){
  alert('Requesting auto transfer: ' + net + ' GHS to MoMo...');
  user.balance-=gross;
  document.getElementById('balance').innerText='Balance: ' + user.balance.toFixed(2) + ' GHS';
 }
}
function showReferrals(){
 alert('REFERRAL: 1 Ref = 50 Gross -> 45 Net AUTO\n100 Refs = 2000 Gross -> 1800 Net + FREE Renewal\nBonus WD: 500 Gross -> 450 Net per Friday x4');
}
loadTasks();
</script>
</body>
</html>

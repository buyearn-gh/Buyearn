<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://js.paystack.co/v1/inline.js"></script>
<title>BuyEarn Ghana - REAL 299</title>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0;padding-bottom:30px}
.top{background:#000;padding:15px;text-align:center;border-bottom:2px solid #00c853}
.green{background:#00c853;color:#000;padding:16px;border:none;width:100%;font-weight:900;border-radius:10px;font-size:18px}
.card{background:#1e1e1e;margin:12px;padding:14px;border-radius:12px;border:1px solid #333}
.prod img{width:100%;border-radius:10px;max-height:300px;object-fit:cover}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="top">
<h2 style="margin:0;color:#00c853">BuyEarn Ghana - REAL 299 GHS</h2>
<div id="status" style="margin:10px 0">Loading...</div>
<button class="green" onclick="payNow()">🔒 PAY 299 GHS NOW - REAL (Paystack)</button>
<p class="small">TEST MODE: Using your pk_test key - Will simulate pay</p>
</div>

<div class="card">
<h3>🔒 Your Wallet - REAL</h3>
<div>Gross: <span id="gross">0</span> GHS | Net: <span id="net">0</span> GHS | Today: <b id="today">0/5</b></div>
</div>

<div class="card">
<h3>👍 Like Tasks - REAL PRODUCTS</h3>
<div id="tasks">Loading...</div>
</div>

<div class="card" style="text-align:center"><a href="admin.html" style="color:#00c853">Go to Admin - Upload Pictures</a></div>

<script>
let pics = JSON.parse(localStorage.getItem('buyearn_pics')||'[]');
let paid = localStorage.getItem('buyearn_paid')==='yes';
let likesToday = parseInt(localStorage.getItem('buyearn_today')||'0');
let gross = parseFloat(localStorage.getItem('buyearn_gross')||'0');

function render(){
 document.getElementById('status').innerHTML = paid ? '✅ PAID MEMBER - 299 GHS PAID' : '❌ Not paid yet';
 document.getElementById('today').innerText = likesToday+'/5';
 document.getElementById('gross').innerText = gross.toFixed(2);
 document.getElementById('net').innerText = (gross*0.9).toFixed(2);
 let t=document.getElementById('tasks');
 if(pics.length===0){ t.innerHTML='<p style="color:#ff0">No pictures yet! Go to Admin.html and upload!</p>'; return; }
 t.innerHTML='';
 pics.forEach(p=>{ t.innerHTML+=`<div style="margin:15px 0;padding:10px;background:#000;border-radius:10px"><img src="${p}" style="width:100%;border-radius:10px"><button onclick="like()" style="background:#00c853;color:#000;padding:12px;width:100%;margin-top:8px;border-radius:8px;font-weight:bold;border:none">👍 Like +0.20 GHS</button></div>`; });
}
function like(){
 if(!paid){ alert('Pay 299 first!'); return; }
 if(likesToday>=5){ alert('5 likes done today!'); return; }
 likesToday++; gross+=0.20;
 localStorage.setItem('buyearn_today', likesToday);
 localStorage.setItem('buyearn_gross', gross);
 render(); alert('Liked! +0.20 GHS');
}
function payNow(){
 var handler = PaystackPop.setup({
    key: 'pk_test_5e1f462e255725f9845d892e519636bc1a699da8',
    email: 'user'+Date.now()+'@buyearn.com',
    amount: 29900,
    currency: 'GHS',
    callback: function(res){
      localStorage.setItem('buyearn_paid','yes'); paid=true; render(); alert('PAYMENT SUCCESS! Ref: '+res.reference+' You are MEMBER now!');
    },
    onClose: function(){ alert('You closed payment'); }
  });
  handler.openIframe();
}
render();
</script>
</body>
</html>

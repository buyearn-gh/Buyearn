<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://js.paystack.co/v1/inline.js"></script>
<title>BuyEarn Ghana - REAL 4 SQUARE</title>
<style>
body{font-family:Arial;background:#0a0a0a;color:#fff;margin:0;padding-bottom:20px}
.top{background:#000;padding:16px;text-align:center;border-bottom:3px solid #00c853;position:sticky;top:0;z-index:10}
.green{background:#00c853;color:#000;padding:16px;border:none;width:100%;font-weight:900;border-radius:10px;font-size:18px;cursor:pointer}
.card{background:#1a1a1a;margin:12px;padding:14px;border-radius:14px;border:1px solid #333}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{background:#000;border-radius:14px;overflow:hidden;border:1px solid #444;aspect-ratio:1/1;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
.prod img{width:100%;height:78%;object-fit:cover;display:block}
.prod button{width:100%;height:22%;background:#00c853;color:#000;border:none;font-weight:900;font-size:13px;cursor:pointer}
.small{font-size:11px;color:#999;margin-top:6px}
</style>
</head>
<body>
<div class="top">
<h2 style="margin:0;color:#00c853">BuyEarn Ghana - REAL 299 GHS</h2>
<div id="status" style="margin:10px 0;font-weight:bold"></div>
<button class="green" onclick="payNow()">🔒 PAY 299 GHS NOW - Paystack</button>
<p class="small">Same 4 perfect squares on phone + laptop | Like 5/day = 1 GHS | Referral 50 | Friday Cashout 20=18 Net</p>
</div>

<div class="card">
<h3>🔒 Wallet</h3>
<div>Gross: <span id="gross">0.00</span> GHS | Net: <span id="net">0.00</span> GHS | Today: <b id="today">0/5</b></div>
</div>

<div class="card">
<h3>👍 Like Tasks - 4 PERFECT SQUARE FRAME</h3>
<div class="grid" id="tasks"></div>
</div>

<div class="card" style="text-align:center">
<a href="admin.html" style="color:#00c853;font-weight:bold">Go to Admin</a> | 
<button onclick="localStorage.setItem('buyearn_paid','yes');location.reload()" style="background:#333;color:#fff;padding:8px 12px;border-radius:6px;border:none;margin-left:8px">Make PAID (Test)</button>
<button onclick="localStorage.clear();location.reload()" style="background:#500;color:#fff;padding:8px 12px;border-radius:6px;border:none;margin-left:8px">Reset</button>
</div>

<script>
// === 4 PICTURES - SAME ON PHONE + LAPTOP - CHANGE THESE LINKS TO YOUR PRODUCTS ===
const FIXED_PICS = [
 "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",
 "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
 "https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=500",
 "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=500"
];

let paid = localStorage.getItem('buyearn_paid')==='yes';
let likesToday = parseInt(localStorage.getItem('buyearn_today')||'0');
let gross = parseFloat(localStorage.getItem('buyearn_gross')||'0');

function render(){
 document.getElementById('status').innerHTML = paid ? '✅ PAID MEMBER - 299 GHS' : '❌ Not paid yet - Pay to unlock';
 document.getElementById('today').innerText = likesToday+'/5';
 document.getElementById('gross').innerText = gross.toFixed(2);
 document.getElementById('net').innerText = (gross*0.9).toFixed(2);
 let t=document.getElementById('tasks');
 t.innerHTML='';
 FIXED_PICS.forEach((p)=>{
   t.innerHTML+=`<div class="prod"><img src="${p}"><button onclick="like()">👍 Like +0.20</button></div>`;
 });
}
function like(){
 if(!paid){ alert('Pay 299 GHS first!'); return; }
 if(likesToday>=5){ alert('You did 5 likes today! Come tomorrow!'); return; }
 likesToday++; gross+=0.20;
 localStorage.setItem('buyearn_today',likesToday);
 localStorage.setItem('buyearn_gross',gross);
 render();
 alert('Liked! +0.20 GHS Added! Today '+likesToday+'/5');
}
function payNow(){
 if(typeof PaystackPop==='undefined'){ alert('Paystack not loaded - check internet'); return; }
 var handler = PaystackPop.setup({
    key: 'pk_test_5e1f462e255725f9845d892e519636bc1a699da8',
    email: 'user'+Date.now()+'@buyearn.com',
    amount: 29900,
    currency: 'GHS',
    callback: function(res){
      localStorage.setItem('buyearn_paid','yes');
      paid=true; render();
      alert('PAYMENT SUCCESS! Ref: '+res.reference+' You are now MEMBER!');
    },
    onClose: function(){ console.log('Payment closed'); }
 });
 handler.openIframe();
}
render();
</script>
</body>
</html>

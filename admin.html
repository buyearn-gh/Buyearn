<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUYEARN ADMIN</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 text-white p-4"><div class="max-w-4xl mx-auto"><h1 class="text-2xl font-black text-yellow-400">BUYEARN ADMIN - 10% FEE</h1><div id="loginDiv" class="mt-6"><input id="email" class="w-full p-3 rounded text-black mb-2" placeholder="Admin Email"><input id="pass" type="password" class="w-full p-3 rounded text-black mb-2" placeholder="Password"><button id="loginBtn" class="w-full bg-yellow-400 text-black font-bold p-3 rounded">LOGIN</button></div><div id="dash" class="hidden mt-6"><div class="grid grid-cols-2 gap-2"><div class="bg-slate-800 p-4 rounded"><p>Total Users</p><p id="tUsers" class="text-2xl font-bold">0</p></div><div class="bg-green-800 p-4 rounded"><p>10% Profit</p><p id="tProfit" class="text-2xl font-bold">GH₵0</p></div></div><div id="userList" class="mt-4 space-y-2"></div><button id="logoutBtn" class="mt-4 bg-red-500 w-full p-2 rounded">Logout</button></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyCE_j2lCAn1MzXhZkyj5MTYvSAiUQJET2U",authDomain:"buyearn-gh.firebaseapp.com",projectId:"buyearn-gh",storageBucket:"buyearn-gh.firebasestorage.app",messagingSenderId:"556320136820",appId:"1:556320136820:web:84ac398833d75147d2bb21"};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);const ADMIN="admin@buyearn.com";const $=id=>document.getElementById(id);$("loginBtn").onclick=()=>{signInWithEmailAndPassword(auth,$("email").value,$("pass").value).catch(e=>alert(e.message))};$("logoutBtn").onclick=()=>signOut(auth);onAuthStateChanged(auth,async(user)=>{if(user&&user.email===ADMIN){$("loginDiv").classList.add("hidden");$("dash").classList.remove("hidden");const snap=await getDocs(collection(db,"users"));let profit=0;$("userList").innerHTML="";snap.forEach(d=>{const u=d.data();const dep=Number(u.deposit||u.totalDeposit||799);profit+=dep*0.1;$("userList").innerHTML+=`<div class="bg-slate-800 p-3 rounded flex justify-between"><span>${u.email||u.name||d.id}</span><span>GH₵${dep} → Fee GH₵${(dep*0.1).toFixed(0)}</span></div>`});$("tUsers").textContent=snap.size;$("tProfit").textContent="GH₵"+profit.toFixed(2)}else if(user){alert("Not admin");signOut(auth)}else{$("loginDiv").classList.remove("hidden");$("dash").classList.add("hidden")}}) </script></body></html>

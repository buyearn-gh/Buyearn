<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ADMIN</title><script src=https://cdn.tailwindcss.com></script></head><body class="bg-slate-900 text-white p-6"><div class=max-w-3xl mx-auto><h1 class="text-3xl font-black text-yellow-400">BUYEARN ADMIN - 10% FEE</h1><div id=loginDiv class=mt-8><input id=email class="w-full p-3 rounded text-black mb-3" value="buyearnghana@gmail.com"><input id=pass type=password class="w-full p-3 rounded text-black mb-3" placeholder=Password><button id=loginBtn class="w-full bg-yellow-400 text-black font-black p-4 rounded">LOGIN</button></div><div id=dash class=hidden><div class="grid grid-cols-2 gap-3 mt-6"><div class="bg-slate-800 p-4 rounded"><p>Users</p><p id=tUsers class="text-3xl font-bold">0</p></div><div class="bg-green-800 p-4 rounded"><p>10% Profit</p><p id=tProfit class="text-3xl font-bold">0</p></div></div><div id=list class="mt-6 space-y-2"></div><button id=logoutBtn class="w-full bg-red-600 p-3 rounded mt-6">Logout</button></div></div><script type=module>import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyCE_j2_An1MzhZxhbyj5MTYvSAiUQJET2U",authDomain:"buyearn-gh.firebaseapp.com",projectId:"buyearn-gh",storageBucket:"buyearn-gh.firebasestorage.app",messagingSenderId:"556320136820",appId:"1:556320136820:web:84ac398833d75147d2bb21"};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);const $=i=>document.getElementById(i);$("loginBtn").onclick=()=>{signInWithEmailAndPassword(auth,$("email").value,$("pass").value).catch(e=>alert(e.code+" "+e.message))};$("logoutBtn").onclick=()=>signOut(auth);onAuthStateChanged(auth,async u=>{if(u){$("loginDiv").classList.add("hidden");$("dash").classList.remove("hidden");const s=await getDocs(collection(db,"users"));let p=0;$("list").innerHTML="";s.forEach(d=>{const x=d.data();const dep=Number(x.deposit||x.totalDeposit||x.amount||299);p+=dep*0.1;$("list").innerHTML+=`<div class="bg-slate-800 p-3 rounded flex justify-between"><span>${x.email||d.id}</span><span>GH₵${dep} Fee:${(dep*0.1).toFixed(0)}</span></div>`});$("tUsers").textContent=s.size;$("tProfit").textContent="GH₵"+p.toFixed(0)}else{$("loginDiv").classList.remove("hidden");$("dash").classList.add("hidden")}})</script></body></html>

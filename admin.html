<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - FINAL</title><style>body{background:#0a1931;color:#fff;padding:12px;font-family:Arial}input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none}button{background:#00ff88;color:#000;font-weight:700}.card{background:#fff;color:#222;padding:12px;border-radius:12px;margin:10px 0}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script></head><body>
<h2>BUYEARN ADMIN FINAL - 10% FEE</h2>
<input id="e" placeholder="Admin email"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button>
<div id="dash" style="display:none"><div class="card">Fee: <b>10%</b> | Net = Gross*0.9</div><div class="card">Weekly: 20 | Gallery: 0.20/like only | Friday payout</div><button onclick="loadUsers()">Load Users</button><div id="users"></div></div>
<script>const firebaseConfig={apiKey:"AIzaSy...",authDomain:"buyearn-gh.firebaseapp.com",projectId:"buyearn-gh"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();function login(){firebase.auth().signInWithEmailAndPassword(e.value,p.value).then(()=>{dash.style.display='block'}).catch(a=>alert(a.message))}function loadUsers(){db.collection("users").get().then(s=>{users.innerHTML="";s.forEach(d=>{let u=d.data();let gross=u.balance||0;let net=gross*0.9;users.innerHTML+=`<div class=card>${u.email||d.id} - Gross:${gross} Net:${net} Fee:${gross-net}<button onclick="pay('${d.id}',${net})">Approve ${net}</button></div>`})})}function pay(id,net){if(confirm("Pay Net "+net+" (10% fee deducted)?")){db.collection("payouts").add({uid:id,amount:net,status:"paid",date:new Date()});db.collection("users").doc(id).update({balance:0});alert("Paid "+net)}}</script></body></html>
